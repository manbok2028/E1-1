services:
  workstation-web:
    build:
      context: .
    image: e1-1-workstation-web:1.0
    container_name: e1-1-compose-web
    ports:
      - "18082:8080"
    environment:
      APP_MODE: compose-lab
    depends_on:
      status-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
  status-api:
    image: hashicorp/http-echo:1.0
    container_name: e1-1-compose-status
    command: ["-listen=:5678", "-text=compose-network-ok"]

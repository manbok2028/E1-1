<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E1-1 개발 워크스테이션</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">E1-1 · Docker Workstation</p>
      <h1>재현 가능한 개발 작업실</h1>
      <p>
        nginx:alpine 기반 커스텀 이미지가 컨테이너 내부 <code>8080</code> 포트에서 실행 중입니다.
      </p>
      <dl>
        <div><dt>이미지</dt><dd>e1-1-workstation-web:1.0</dd></div>
        <div><dt>호스트 접속</dt><dd>http://localhost:18080</dd></div>
        <div><dt>검증 상태</dt><dd id="mount-state">호스트 변경이 재빌드 없이 반영된 콘텐츠 (v2)</dd></div>
      </dl>
    </main>
  </body>
</html>
